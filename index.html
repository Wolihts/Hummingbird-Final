<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GarageBand Inspired Music Tool UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="eyebrow">Studio Tools</div>
        <h1>Music Tool UI</h1>
        <p>Pick a tool to change the workspace and track view.</p>
      </div>
      <div class="tool-list" id="toolList"></div>
    </aside>

    <section class="workspace">
      <div class="workspace-top">
        <div class="workspace-card">
          <div class="workspace-head">
            <div>
              <div class="eyebrow">Active Workspace</div>
              <h2 id="panelTitle">Guitar Controls</h2>
              <p class="workspace-copy" id="panelText"></p>
            </div>
            <div class="workspace-badge" id="workspaceBadge">G</div>
          </div>

          <div class="stats">
            <div class="stat-card">
              <div class="stat-label mini-label">Tone</div>
              <div class="stat-value" id="toneValue">Warm</div>
            </div>
            <div class="stat-card">
              <div class="stat-label mini-label">Mode</div>
              <div class="stat-value" id="modeValue">Guitar</div>
            </div>
            <div class="stat-card">
              <div class="stat-label mini-label">Output</div>
              <div class="stat-value" id="outputValue">Stereo</div>
            </div>
          </div>

          <div class="detail-grid">
            <div class="detail-card">
              <div class="transport-label">Performance View</div>
              <div class="bars" id="performanceBars"></div>
            </div>
            <div class="detail-card">
              <div class="transport-label">Quick Controls</div>
              <div class="control-stack" id="quickControls"></div>
            </div>
          </div>
        </div>

        <div class="transport">
          <div class="transport-dot"></div>
          <span class="transport-label">Live Session</span>
        </div>
      </div>

      <div class="timeline-wrapper">
        <div class="timeline-layout">
          <div class="track-sidebar" id="trackSidebar"></div>

          <div class="timeline-main">
            <div class="timeline-scroll">
              <div class="ruler" id="ruler"></div>
              <div class="playhead"></div>
              <div id="laneContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
