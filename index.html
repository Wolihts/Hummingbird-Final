<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GarageBand Inspired Music Tool UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="eyebrow">Studio Tools</div>
        <h1>Music Tool UI</h1>
        <p>Pick a tool to change the workspace and track view.</p>
      </div>
      <div class="tool-list" id="toolList"></div>
    </aside>

    <section class="workspace">
      <div class="workspace-top">
        <div class="workspace-card">
          <div class="workspace-head">
            <div>
              <div class="eyebrow">Active Workspace</div>
              <h2 id="panelTitle">Guitar Controls</h2>
              <p class="workspace-copy" id="panelText"></p>
            </div>
            <div class="workspace-badge" id="workspaceBadge">G</div>
          </div>

          <div class="stats">
            <div class="stat-card">
              <div class="stat-label mini-label">Tone</div>
              <select class="tone-select" id="toneSelect" aria-label="Select instrument tone"></select>
            </div>
            <div class="stat-card">
              <div class="stat-label mini-label">Mode</div>
              <div class="stat-value" id="modeValue">Guitar</div>
            </div>
            <div class="stat-card">
              <div class="stat-label mini-label">Output</div>
              <div class="stat-value" id="outputValue">Stereo</div>
            </div>
          </div>

          <div class="detail-grid">
            <div class="detail-card detail-card-instrument">
              <div class="transport-label">Instrument View</div>
              <div class="instrument-stage" id="instrumentStage"></div>
            </div>
            <div class="detail-card detail-card-keys">
              <div class="transport-label">Key Layout</div>
              <div class="keys-panel">
                <div class="key-range" id="keyRange"></div>
                <div class="keys-board" id="keysBoard"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="transport">
          <div class="transport-dot" id="transportDot"></div>
          <button class="transport-btn transport-icon-btn" id="rewindBtn" type="button" aria-label="Rewind timeline" title="Rewind timeline">|&lt;</button>
          <button class="transport-btn transport-btn-primary transport-icon-btn" id="playBtn" type="button" aria-label="Play timeline" title="Play timeline">&#9654;</button>
          <button class="transport-btn transport-icon-btn" id="stopBtn" type="button" aria-label="Stop playback" title="Stop playback">&#9632;</button>
          <button class="transport-btn transport-icon-btn" id="shrinkTimelineBtn" type="button" aria-label="Shrink timeline" title="Shrink timeline">−</button>
          <button class="transport-btn transport-icon-btn" id="expandTimelineBtn" type="button" aria-label="Expand timeline" title="Expand timeline">+</button>
          <button class="transport-btn transport-icon-btn" id="downloadSessionBtn" type="button" aria-label="Download session" title="Download session">&#8681;</button>
          <button class="transport-btn transport-icon-btn" id="uploadSessionBtn" type="button" aria-label="Upload session" title="Upload session">&#8679;</button>
          <input class="session-file-input" id="sessionFileInput" type="file" accept="application/json,.json,.hummingbird" aria-label="Upload session file" />
          <span class="transport-label" id="transportStatus">Session Idle</span>
        </div>
      </div>

      <div class="timeline-wrapper">
        <div class="timeline-layout">
          <div class="track-sidebar">
            <div class="track-sidebar-header">
              <div class="measure track-sidebar-measure">
                <div>Tracks</div>
                <div class="ticks"></div>
              </div>
            </div>
            <div id="trackSidebar"></div>
          </div>

          <div class="timeline-main">
            <div class="timeline-scroll">
              <div class="ruler" id="ruler"></div>
              <div class="playhead"></div>
              <div id="laneContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="step-editor hidden" id="stepEditor" aria-hidden="true">
    <div class="step-editor-head">
      <div>
        <div class="eyebrow">Stack Editor</div>
        <div class="step-editor-title" id="stepEditorTitle">Step</div>
      </div>
      <button class="step-editor-close" id="stepEditorClose" type="button" aria-label="Close editor">Close</button>
    </div>
    <div class="step-editor-list" id="stepEditorList"></div>
    <div class="step-editor-add">
      <select class="step-editor-select" id="stepEditorSelect"></select>
      <button class="transport-btn transport-btn-primary" id="stepEditorAddBtn" type="button">Add Note</button>
    </div>
  </div>

  <script src="https://unpkg.com/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
